name: Build WWMI-DX12 NRMM focus fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nrmm-focus-fix:
    runs-on: windows-latest
    steps:
      - name: Check out WWMI-DX12 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch required engine and ReShade SDK submodules
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git submodule update --init --depth 1
          git -C reshade_addon/sdk submodule update --init deps/imgui
          if ((git -C third_party/3Dmigoto rev-parse --is-shallow-repository) -eq 'true') {
            git -C third_party/3Dmigoto fetch --tags --unshallow
          } else {
            git -C third_party/3Dmigoto fetch --tags
          }

      - name: Apply NRMM input focus fix
        shell: pwsh
        run: |
          $path = 'reshade_addon/present/present_engine.cpp'
          $source = [System.IO.File]::ReadAllText($path)
          $before = 'if (f.focused) PortApi::TickInput();'
          $after = 'PortApi::TickInput();'
          $count = ([regex]::Matches($source, [regex]::Escape($before))).Count
          if ($count -ne 1) { throw "Expected one input-focus gate, found $count. Stopping rather than making an unsafe edit." }
          [System.IO.File]::WriteAllText($path, $source.Replace($before, $after))
          Write-Host 'Patched one input-focus gate.'

      - name: Build Release x64
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\amd64\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild was not found on the runner.' }
          & $msbuild package.proj -m -nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'build_addon/wwmi_dx12.addon64')) { throw 'Expected .addon64 build output was not found.' }

      - name: Upload test add-on
        uses: actions/upload-artifact@v4
        with:
          name: wwmi-dx12-nrmm-focus-fix-UNTESTED
          path: build_addon/wwmi_dx12.addon64
          if-no-files-found: error
